<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; }
        .test-image { 
            width: 100%; 
            max-width: 800px; 
            height: 400px;
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            margin: 10px 0;
        }
        h2 { margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Image Test - 首页轻量化图片</h1>
    
    <h2>Method 1: CSS Background (FullScreenSection 使用的方式)</h2>
    <div class="test-image" style="background-image: url('/img/home/feature-lightweight.webp')"></div>
    
    <h2>Method 2: IMG Tag</h2>
    <img src="/img/home/feature-lightweight.webp" style="max-width: 800px; border: 2px solid #fff;" 
         onerror="this.parentElement.innerHTML += '<p style=color:red>❌ 图片加载失败!</p>'"
         onload="this.parentElement.innerHTML += '<p style=color:green>✅ 图片加载成功!</p>'">
    
    <h2>对比: 其他Feature图片</h2>
    <div class="test-image" style="background-image: url('/img/home/feature-safety.webp')"></div>
    <p>👆 feature-safety.webp (for comparison)</p>
    
    <div class="test-image" style="background-image: url('/img/home/feature-easy.webp')"></div>
    <p>👆 feature-easy.webp (for comparison)</p>
    
    <h2>Direct Links</h2>
    <p><a href="/img/home/feature-lightweight.webp" target="_blank" style="color: yellow;">Open feature-lightweight.webp in new tab</a></p>
    <p><a href="/img/home/feature-safety.webp" target="_blank" style="color: yellow;">Open feature-safety.webp in new tab</a></p>
</body>
</html>
